# Netlify Configuration for Essentials Creative Studio
# Optimized for multimedia content and performance

[build]
  publish = "."
  command = "echo 'Static site ready for deployment'"

[build.environment]
  NODE_VERSION = "18"

# Domain configuration
[context.production]
  command = "echo 'Production build ready'"
  [context.production.environment]
    NODE_ENV = "production"

[context.deploy-preview]
  command = "echo 'Preview build ready'"
  [context.deploy-preview.environment]
    NODE_ENV = "preview"

[context.branch-deploy]
  command = "echo 'Branch deploy ready'"
  [context.branch-deploy.environment]
    NODE_ENV = "development"

# Pretty URLs: redirect path-only URLs to .html pages
[[redirects]]
  from = "/macc"
  to = "/macc/"
  status = 301

[[redirects]]
  from = "/photography"
  to = "/photography.html"
  status = 301

[[redirects]]
  from = "/photography/*"
  to = "/photography.html"
  status = 301

[[redirects]]
  from = "/graphic-design"
  to = "/design.html"
  status = 301

[[redirects]]
  from = "/graphic-design/*"
  to = "/design.html"
  status = 301

[[redirects]]
  from = "/design"
  to = "/design.html"
  status = 301

[[redirects]]
  from = "/design/*"
  to = "/design.html"
  status = 301

[[redirects]]
  from = "/social-media/*"
  to = "/social-media.html"
  status = 200

# Shop / tapestries are not ready for launch — keep them offline.
# force = true makes these win over the committed shop.html / tapestries.html files.
