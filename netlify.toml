# Image optimization headers
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Vary = "Accept"

# Font optimization headers
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# CSS and JS optimization headers
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Content Security Policy
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.instagram.com https://www.tiktok.com https://www.youtube.com https://sandbox.web.squarecdn.com https://web.squarecdn.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      media-src 'self' https:;
      connect-src 'self' https://formspree.io https://api.instagram.com https://www.youtube.com https://connect.squareupsandbox.com https://connect.squareup.com;
      frame-src https://www.instagram.com https://www.tiktok.com https://www.youtube.com https://player.vimeo.com;
    '''

# Form handling — using Netlify Forms (native), no functions needed.
# (Removed /api/contact -> /.netlify/functions/contact redirect; function archived.)

# 404 handling - This should be the last redirect rule
# and only applies when no other files or rules match
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Image format transformation for modern browsers
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Vary = "Accept"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Vary = "Accept"

[[headers]]
  for = "/*.png"
  [headers.values]
    Vary = "Accept"

# Preload critical resources
[[headers]]
  for = "/"
  [headers.values]
    Link = "</assets/js/navigation.js>; rel=preload; as=script"
