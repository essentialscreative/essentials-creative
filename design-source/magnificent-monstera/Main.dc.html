<script data-dc-script data-props='{
  "spark": {"editor": "color", "default": "#E03A12", "options": ["#E03A12", "#E8B530", "#7E2639", "#B8601F"], "section": "Ink"},
  "misregister": {"editor": "range", "default": 15, "min": 0, "max": 34, "step": 1, "unit": "px", "section": "Ink"},
  "$preview": {"width": 1728, "height": 2304}
}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.misregister ?? 15;
    return {
      spark: this.props.spark ?? '#E03A12',
      off: { x: (-m * 0.72).toFixed(1), y: (m * 0.62).toFixed(1) },
    };
  }
}
</script>
